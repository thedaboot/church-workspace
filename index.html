<!doctype html>
<html lang="ko" data-seed-color-mode="system" data-seed-user-color-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>더다붓 워크스페이스</title>
    <meta name="description" content="함께 준비하고, 함께 섬기는 청년들의 공간" />
    <!-- 전역 OG (대표 URL). 개별 공유 링크 /s/... 는 api/share가 절대 URL·동적 메타를 조립한다. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="더다붓 워크스페이스" />
    <meta property="og:description" content="함께 준비하고, 함께 섬기는 청년들의 공간" />
    <meta property="og:url" content="https://church-workspace.vercel.app/" />
    <meta property="og:image" content="https://church-workspace.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="더다붓 워크스페이스" />
    <meta name="twitter:description" content="함께 준비하고, 함께 섬기는 청년들의 공간" />
    <meta name="twitter:image" content="https://church-workspace.vercel.app/og.png" />

    <script>
      // 첫 페인트 전에 테마 결정: 저장된 선택 > 시스템 설정
      (function () {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.setAttribute('data-seed-user-color-scheme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
