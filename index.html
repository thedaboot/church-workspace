<!doctype html>
<html lang="ko" data-seed-color-mode="system" data-seed-user-color-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>더다붓 워크스페이스</title>

    <!-- 홈 화면에 추가(PWA) — 안드로이드는 manifest, iOS는 apple-* 메타를 본다 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="더다붓" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 상태바 색: 라이트/다크 각각 앱 배경과 맞춘다 -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f5f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191919" />
    <meta name="description" content="함께 준비하고, 함께 섬기는 청년들의 공간" />
    <!-- 전역 OG (대표 URL). 개별 공유 링크 /s/... 는 api/share가 절대 URL·동적 메타를 조립한다. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="더다붓 워크스페이스" />
    <meta property="og:description" content="함께 준비하고, 함께 섬기는 청년들의 공간" />
    <meta property="og:url" content="https://church-workspace.vercel.app/" />
    <meta property="og:site_name" content="더다붓 워크스페이스" />
    <meta property="og:locale" content="ko_KR" />
    <!-- ?v= 는 크롤러 이미지 캐시 갱신용. 이미지를 바꾸면 숫자를 올린다. -->
    <meta property="og:image" content="https://church-workspace.vercel.app/og.png?v=2" />
    <meta property="og:image:secure_url" content="https://church-workspace.vercel.app/og.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="더다붓 워크스페이스" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="더다붓 워크스페이스" />
    <meta name="twitter:description" content="함께 준비하고, 함께 섬기는 청년들의 공간" />
    <meta name="twitter:image" content="https://church-workspace.vercel.app/og.png?v=2" />

    <script>
      // 첫 페인트 전에 테마 결정: 저장된 선택 > 시스템 설정
      (function () {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.setAttribute('data-seed-user-color-scheme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
